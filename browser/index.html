<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduHungry Browser — a web browser inside your browser</title>
  <meta name="description" content="A full tabbed web browser that runs inside your browser. Proxy-powered with automatic engine failover and reader mode.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%231f6feb'/%3E%3Cpath d='M2 12h20M12 2c3 3 4.5 6.3 4.5 10S15 19 12 22c-3-3-4.5-6.3-4.5-10S9 5 12 2z' fill='none' stroke='white' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">

    <header id="chrome">
      <div id="tabstrip">
        <div id="tabs" role="tablist" aria-label="Browser tabs"></div>
        <button id="newtab" title="New tab (Ctrl+T)" aria-label="New tab"></button>
      </div>

      <div id="toolbar">
        <button class="tbtn" id="btn-back" title="Back (Alt+←)" aria-label="Back"></button>
        <button class="tbtn" id="btn-fwd" title="Forward (Alt+→)" aria-label="Forward"></button>
        <button class="tbtn" id="btn-reload" title="Reload (Ctrl+R)" aria-label="Reload"></button>
        <button class="tbtn" id="btn-home" title="Home" aria-label="Home"></button>

        <div id="urlwrap">
          <span class="shield" title="Proxy mode — routed through CORS engines">
            <svg viewBox="0 0 24 24"><path d="M12 2l8 3.5V11c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V5.5L12 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </span>
          <input id="urlbar" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Search or type a URL" aria-label="Address and search bar">
        </div>

        <button class="tbtn" id="btn-settings" title="Settings" aria-label="Settings"></button>
      </div>

      <div id="progress"><div id="progress-bar"></div></div>
    </header>

    <main id="views"></main>

    <footer id="statusbar">
      <span id="hover-url"></span>
      <span id="engine-status"></span>
    </footer>

  </div>

  <div id="toasts" aria-live="polite"></div>

  <div id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-label="Browser settings">
      <h2>Settings</h2>
      <p class="sub">EduHungry Browser · proxy mode</p>

      <div class="field">
        <label for="set-engine">Proxy engine</label>
        <select id="set-engine"></select>
      </div>

      <div class="field">
        <label for="set-search">Search engine</label>
        <select id="set-search"></select>
      </div>

      <div class="field">
        <label>Engine health (this session)</label>
        <div id="engine-report"></div>
      </div>

      <div class="modal-actions">
        <button id="set-clear" type="button">Clear tabs &amp; history</button>
        <button id="modal-close" type="button">Done</button>
      </div>
    </div>
  </div>

  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
